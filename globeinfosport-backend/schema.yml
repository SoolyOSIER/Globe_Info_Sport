  /api/v1/articles/:
    get:
      operationId: api_v1_articles_list
      description: 'Cycle de vie des articles : brouillon, validation, publication
        et archive.'
      parameters:
      - in: query
        name: a_la_une
        schema:
          type: boolean
      - in: query
        name: categorie
        schema:
          type: integer
      - in: query
        name: categorie_slug
        schema:
          type: string
      - in: query
        name: date_debut
        schema:
          type: string
          format: date
      - in: query
        name: date_fin
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - ARCHIVE
          - A_VALIDER
          - BROUILLON
          - PUBLIE
        description: |-
          * `BROUILLON` - Brouillon
          * `A_VALIDER` - À valider
          * `PUBLIE` - Publié
          * `ARCHIVE` - Archivé
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
    post:
      operationId: api_v1_articles_create
      description: 'Cycle de vie des articles : brouillon, validation, publication
        et archive.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCreate'
          description: ''
