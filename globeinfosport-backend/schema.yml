          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlbumGalerie'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumGalerie'
          description: ''
