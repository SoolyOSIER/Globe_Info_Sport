services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globeinfosport}
      POSTGRES_USER: ${POSTGRES_USER:-globeinfosport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globeinfosport}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./globeinfosport-backend
      target: production
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - db
      - redis
    volumes:
      - backend_media:/app/media

  celery:
    build:
      context: ./globeinfosport-backend
      target: production
    restart: unless-stopped
    command: celery -A config worker --loglevel=INFO
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./globeinfosport-backend
      target: production
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - db
      - redis

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - backend_media:/var/www/media:ro

volumes:
  postgres_data:
  redis_data:
  backend_media:
